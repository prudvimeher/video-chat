[project]
name = "video-chat"
version = "0.1.0"
description = "FastAPI WebSocket chat-room server"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
# Use Windows system certificate store to avoid corporate-proxy SSL issues.
system-certs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
